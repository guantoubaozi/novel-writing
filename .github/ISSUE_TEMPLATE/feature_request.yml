name: Feature request
description: Propose an improvement to the free author-controlled workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Author problem
      description: Describe the writing problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Author authority and compatibility impact
      description: Explain how the proposal avoids silent canon or manuscript changes.
